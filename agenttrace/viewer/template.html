<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agenttrace</title>
<style>
  :root {
    --bg:#ffffff; --fg:#0b0e14; --muted:#4b5563; --line:#cbd1da; --card:#eef1f5;
    --thought:#6d28d9; --answer:#1d4ed8; --comment:#0e7490; --tool:#b45309;
    --result:#0f766e; --error:#b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d0f13; --fg:#f4f6f8; --muted:#aeb6c2; --line:#3a3d47; --card:#1b1e25;
      --thought:#b794ff; --answer:#7cb0ff; --comment:#3ddbf0; --tool:#fbbf24;
      --result:#5eead4; --error:#fb7185;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-weight:450;
         font:450 15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line);
           position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { margin:0; font-size:17px; }
  #summary { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; font-size:12px; }
  #summary .pill { padding:2px 9px; border-radius:999px; border:1px solid var(--line);
                   color:var(--muted); }
  #summary .pill b { color:var(--fg); }
  .incomplete { color:var(--error); font-weight:700; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  details.seed { margin-bottom:14px; }
  details.seed > summary { cursor:pointer; font-weight:600; }
  .seedblock { background:var(--card); border:1px solid var(--line); border-radius:6px;
               padding:9px 11px; margin-top:8px; }
  .seedlabel { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
               color:var(--answer); margin-bottom:4px; }
  .md { color:var(--fg); font-weight:500; }
  .turn { margin:14px 0; }
  .turn-head { font-weight:700; cursor:pointer; user-select:none; padding:6px 0;
               border-bottom:1px solid var(--line); }
  .turn-head::before { content:"▾ "; color:var(--muted); }
  .turn.collapsed .turn-head::before { content:"▸ "; }
  .turn.collapsed .flow { display:none; }

  /* vertical flow spine */
  .flow { position:relative; margin:10px 0 0; padding-left:34px; }
  .flow::before { content:""; position:absolute; left:15px; top:4px; bottom:4px;
                  width:2px; background:var(--line); }
  /* each step is a bordered card (a clear "cell") with a type-colored accent */
  .node { position:relative; margin:0 0 12px; padding:9px 12px 10px;
          background:var(--card); border:1px solid var(--line);
          border-left:4px solid var(--muted); border-radius:8px; }
  .node:last-child { margin-bottom:4px; }
  .node .dot { position:absolute; left:-27px; top:12px; width:14px; height:14px;
               border-radius:50%; background:var(--bg); border:3px solid var(--muted); }
  .node.thought { border-left-color:var(--thought); } .node.thought .dot { border-color:var(--thought); }
  .node.answer  { border-left-color:var(--answer); }  .node.answer  .dot { border-color:var(--answer); }
  .node.comment { border-left-color:var(--comment); } .node.comment .dot { border-color:var(--comment); }
  .node.action  { border-left-color:var(--tool); }    .node.action  .dot { border-color:var(--tool); }
  .node.action.err, .node.error { border-left-color:var(--error); }
  .node.action.err .dot, .node.error .dot { border-color:var(--error); }

  /* lightweight markdown styling for prompt/reasoning text */
  .md-h { font-weight:700; font-size:1.02em; margin:5px 0 2px; }
  .md-li { padding-left:15px; text-indent:-9px; }
  .md-li::before { content:"\2022 "; color:var(--muted); }
  .md-sp { height:7px; }
  code.code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em;
              background:var(--line); color:var(--tool); padding:1px 5px; border-radius:4px; }
  .link { color:var(--answer); text-decoration:underline; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px;
           border-radius:999px; color:#fff; margin-bottom:5px; }
  .b-thought { background:var(--thought); }
  .b-answer  { background:var(--answer); }
  .b-comment { background:var(--comment); }
  .b-tool    { background:var(--tool); }
  .b-error   { background:var(--error); }
  .b-meta    { background:var(--muted); }
  .text { color:var(--fg); font-weight:500; }
  .muted { color:var(--muted); }
  .notice { color:var(--muted); font-style:italic; margin:4px 0 10px; }
  .cmd { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:13px; font-weight:500; color:var(--fg); background:var(--bg);
         border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-top:2px;
         white-space:pre-wrap; }
  details.out summary { cursor:pointer; color:var(--result); font-size:13px;
                        font-weight:600; margin-top:5px; }
  .node.action.err details.out summary { color:var(--error); }
  pre.out { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:13px; font-weight:500; color:var(--fg); white-space:pre-wrap;
            background:var(--bg); border:1px solid var(--line); border-radius:6px;
            padding:9px; margin:6px 0 0; max-height:320px; overflow:auto; }
  .subtrace { margin-top:10px; padding:8px 10px 2px; border:1px dashed var(--line);
              border-radius:8px; }
  .sublabel { font-size:12px; font-weight:700; color:var(--thought); margin-bottom:6px; }
  details.diffpanel { margin:0 0 16px; border:1px solid var(--line); border-radius:8px;
                      background:var(--card); }
  details.diffpanel > summary { cursor:pointer; font-weight:700; padding:10px 12px; }
  details.diffpanel .cols { display:flex; gap:2%; padding:0 12px 12px; }
  .diff-col { display:inline-block; vertical-align:top; width:49%; }
  .diff-col h3 { margin:0 0 6px; font-size:12px; font-weight:700; color:var(--muted); }
  .diff-col > div { white-space:pre-wrap; padding:2px 5px; border-radius:3px; font-weight:500;
                    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  .diff-add { background:rgba(22,163,74,0.30); }
  .diff-del { background:rgba(220,38,38,0.30); }
  @media (prefers-color-scheme: dark) {
    .diff-add { background:rgba(34,197,94,0.32); }
    .diff-del { background:rgba(248,113,113,0.32); }
  }
</style>
</head>
<body>
<header>
  <h1>agenttrace</h1>
  <div id="summary"></div>
</header>
<main>
<div id="diffpanel">__DIFF_PANEL__</div>
<div id="timeline"></div>
</main>
<script>
const TRACE = __TRACE_JSON__;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// --- lightweight, safe markdown (inline code / bold / links / headings / bullets)
function mdInline(parent, text) {
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    if (tok[0] === "`") {
      parent.appendChild(el("code", "code", tok.slice(1, -1)));
    } else if (tok.slice(0, 2) === "**") {
      parent.appendChild(el("strong", null, tok.slice(2, -2)));
    } else {
      const mt = /\[([^\]]+)\]\(([^)]+)\)/.exec(tok);
      parent.appendChild(el("span", "link", mt[1]));   // text only, not clickable
    }
    last = re.lastIndex;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}
function mdInto(parent, text) {
  (text || "").split("\n").forEach(function (line) {
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      const h = el("div", "md-h"); mdInline(h, m[2]); parent.appendChild(h); return;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const li = el("div", "md-li"); mdInline(li, line.replace(/^\s*[-*]\s+/, "")); parent.appendChild(li); return;
    }
    if (line.trim() === "") { parent.appendChild(el("div", "md-sp")); return; }
    const d = document.createElement("div"); mdInline(d, line); parent.appendChild(d);
  });
}
function seedBlock(label, text) {
  const w = el("div", "seedblock");
  w.appendChild(el("div", "seedlabel", label));
  const b = el("div", "md"); mdInto(b, text); w.appendChild(b);
  return w;
}

function pill(label, n) {
  const p = el("span", "pill");
  p.appendChild(el("span", null, label + " "));
  p.appendChild(el("b", null, String(n)));
  return p;
}
function card(node, badgeCls, badgeText, bodyText) {
  node.appendChild(el("span", "badge " + badgeCls, badgeText));
  if (bodyText != null) {
    const b = el("div", "text"); mdInto(b, bodyText); node.appendChild(b);
  }
  return node;
}
function outputBlock(label, text) {
  const det = document.createElement("details");
  det.className = "out";
  det.appendChild(el("summary", null, label));
  det.appendChild(el("pre", "out", text || ""));
  return det;
}

// reasoning with a role is a spoken message; without one it is the CoT summary
function reasoningKind(ev) {
  const role = (ev.data || {}).role;
  if (role === "assistant") return ["answer", "b-answer", "답변"];
  if (role === "agent_message") return ["comment", "b-comment", "코멘터리"];
  return ["thought", "b-thought", "요약"];        // CoT summary
}

function resultLabel(d) {
  const code = (d || {}).exit_code;
  return (code !== undefined && code !== null) ? "결과 (exit " + code + ")" : "결과";
}

function appendSubTrace(node, sub) {
  const wrap = el("div", "subtrace");
  wrap.appendChild(el("div", "sublabel",
    "↳ 서브에이전트" + (sub.run_id ? " (" + sub.run_id + ")" : "")));
  renderTurns(sub.turns || [], wrap);
  node.appendChild(wrap);
}

function renderFlow(events) {
  const flow = el("div", "flow");

  // Index tool results/errors by call_id so a call claims its output wherever
  // it sits in the stream (in rollouts they are not adjacent).
  const byCall = {};
  events.forEach(function (e) {
    const cid = (e.data || {}).call_id;
    if (cid && (e.type === "tool_result" || e.type === "error") && !byCall[cid]) {
      byCall[cid] = e;
    }
  });
  const consumed = new Set();

  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    const d = ev.data || {};
    if (ev.type === "reasoning") {
      const [cls, badge, label] = reasoningKind(ev);
      flow.appendChild(card(el("div", "node " + cls), badge, label, d.text || ""));
    } else if (ev.type === "tool_call") {
      // pair by call_id; fall back to the immediately following event
      let paired = d.call_id ? byCall[d.call_id] : null;
      if (!paired) {
        const n = events[i + 1];
        if (n && (n.type === "tool_result" || n.type === "error")) paired = n;
      }
      const isErr = paired && paired.type === "error";
      const node = el("div", "node action" + (isErr ? " err" : ""));
      node.appendChild(el("span", "badge b-tool", isErr ? "도구 (실패)" : "도구"));
      node.appendChild(el("div", "cmd", (d.name || "") + " " + (d.arguments || "")));
      if (paired) {
        const nd = paired.data || {};
        node.appendChild(outputBlock(resultLabel(nd), nd.output || ""));
        consumed.add(paired);
      }
      if (d.sub_trace) appendSubTrace(node, d.sub_trace);
      flow.appendChild(node);
    } else if (ev.type === "tool_result") {
      if (consumed.has(ev)) continue;               // already shown under its call
      const node = el("div", "node action");
      node.appendChild(outputBlock(resultLabel(d), d.output || ""));
      if (d.sub_trace) appendSubTrace(node, d.sub_trace);
      flow.appendChild(node);
    } else if (ev.type === "error") {
      if (consumed.has(ev)) continue;               // shown under its tool call
      const node = el("div", "node error");
      node.appendChild(el("span", "badge b-error", "에러"));
      node.appendChild(el("div", "text", d.message || d.output || JSON.stringify(d)));
      flow.appendChild(node);
    } else {
      const node = el("div", "node");
      node.appendChild(el("span", "badge b-meta", d.item_type || ev.type));
      node.appendChild(el("div", "text muted", d.note || (ev.raw ? JSON.stringify(ev.raw) : "")));
      flow.appendChild(node);
    }
  }
  return flow;
}

function renderTurns(turns, container) {
  (turns || []).forEach(function (turn) {
    const block = el("section", "turn");
    const head = el("div", "turn-head", "Turn " + turn.seq);
    head.addEventListener("click", function () { block.classList.toggle("collapsed"); });
    block.appendChild(head);
    const hasReasoning = (turn.events || []).some(function (e) { return e.type === "reasoning"; });
    if (!hasReasoning) block.appendChild(el("div", "notice", "추론 요약 없음"));
    block.appendChild(renderFlow(turn.events || []));
    container.appendChild(block);
  });
}

function renderTrace(trace) {
  // summary bar
  let thoughts = 0, answers = 0, tools = 0, errors = 0;
  (trace.turns || []).forEach(function (t) {
    (t.events || []).forEach(function (e) {
      if (e.type === "reasoning") {
        if ((e.data || {}).role) answers++; else thoughts++;
      } else if (e.type === "tool_call") tools++;
      else if (e.type === "error") errors++;
    });
  });
  const sum = document.getElementById("summary");
  sum.appendChild(pill("run", trace.run_id || "(none)"));
  sum.appendChild(pill("추론", thoughts));
  sum.appendChild(pill("답변", answers));
  sum.appendChild(pill("도구", tools));
  sum.appendChild(pill("에러", errors));
  if (trace.incomplete) sum.appendChild(el("span", "pill incomplete", "INCOMPLETE"));

  const tl = document.getElementById("timeline");
  const seed = trace.seed || {};
  const sd = document.createElement("details");
  sd.className = "seed";
  sd.appendChild(el("summary", null, "seed 프롬프트"));
  if (seed.system_prompt) sd.appendChild(seedBlock("system", seed.system_prompt));
  sd.appendChild(seedBlock("user", seed.user_input || ""));
  tl.appendChild(sd);

  renderTurns(trace.turns || [], tl);
}

renderTrace(TRACE);
</script>
</body>
</html>
